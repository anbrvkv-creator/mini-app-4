<style>
:root{
  --deep:#15231E; --deep2:#0F1A16; --top:#233D33;
  --gold:#D8BC84; --gold-dim:#AE9763;
  --cream:#EEE8DC; --dim:#9AA89F; --rose:#D9A9A1;
  --card:rgba(238,232,220,.045); --line:rgba(238,232,220,.11);
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--cream);
  background:radial-gradient(ellipse 120% 70% at 50% -10%,var(--top) 0%,var(--deep) 55%,var(--deep2) 100%) var(--deep);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.wrap{max-width:560px;margin:0 auto;padding:22px 22px calc(96px + env(safe-area-inset-bottom,0px))}
.cap{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dim)}
.cap.gold{color:var(--gold)}
.dateline{text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.dateline span+span{margin-left:1.2em}

/* portrait */
.portrait{width:186px;height:186px;margin:26px auto 22px;border-radius:50%;padding:3px;
  background:linear-gradient(140deg,#F1DDAE,var(--gold) 35%,#7E6A40 70%,var(--gold));
  box-shadow:0 0 0 1px rgba(216,188,132,.18),0 0 48px rgba(216,188,132,.22)}
.portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--deep)}
.who{text-align:center}
.who h1{font-weight:normal;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);line-height:1.35;margin:10px 0 10px}
.who p{font-style:italic;color:var(--dim);font-size:16px;max-width:30em;margin:0 auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px}
.block{margin-top:30px}
.block>.cap{display:block;margin-bottom:12px}

/* forecast */
.forecast-empty{border-style:dashed;text-align:center;color:var(--dim);font-style:italic;font-size:15px}
.forecast-empty .cap{display:block;font-style:normal;margin-bottom:8px}
.period{text-align:center}
.period h2{font-weight:normal;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:8px 0 4px}
.period .dates{font-style:italic;color:var(--dim);font-size:15px}
.period .left{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.ribbon{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding:4px 2px 2px}
.ribbon::-webkit-scrollbar{display:none}
.rb{flex:0 0 88px;text-align:center;position:relative}
.rb:before{content:"";position:absolute;top:6px;left:0;right:0;height:1px;background:var(--line)}
.rb:first-child:before{left:50%}.rb:last-child:before{right:50%}
.dot{position:relative;width:13px;height:13px;border-radius:50%;margin:0 auto;border:1px solid var(--gold-dim);background:var(--deep)}
.rb.past .dot{background:var(--gold-dim)}
.rb.now .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(216,188,132,.6)}
.rb small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:8px;line-height:1.3}
.rb.now small{color:var(--gold)}
.meaning p+p{margin-top:10px}
.caution{margin-top:14px;padding-left:14px;border-left:2px solid var(--rose);color:var(--cream)}
.caution .cap{color:var(--rose);display:block;margin-bottom:4px}

.meaning h3,.tr h3{font-weight:normal;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:8px 0 2px}
.meaning>.cap{display:block}
.note+p,.note+.x{margin-top:10px}
.sub{margin-top:16px}
.sub .cap,.bg .cap,.phase .cap{display:block;margin-bottom:4px}
.adv{list-style:none}
.adv li{padding:5px 0 5px 18px;position:relative;font-size:16px}
.adv li:before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--gold-dim)}
.bg{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.bg p{padding:2px 0}.bg i{color:var(--dim)}
.tr{margin-top:14px}
.tr>p+p{margin-top:10px}
.phase{margin-top:14px;padding-left:14px;border-left:2px solid var(--gold);font-size:16px}
.prac{margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.prhead{display:flex;width:100%;justify-content:space-between;padding:10px 0;color:var(--gold);font-size:16px}
.prhead:after{content:"+";color:var(--gold-dim)}.prhead.open:after{content:"–"}
.prbody ol{list-style:none;counter-reset:s;margin-top:6px}
.prbody ol li{counter-increment:s;display:flex;gap:16px;padding:6px 0;font-size:16px}
.prbody ol li:before{content:counter(s);flex:0 0 14px;color:var(--gold-dim);font-size:13px;padding-top:3px}
/* word */
.word{text-align:center;padding:26px 22px}
.word q{display:block;font-size:19px;line-height:1.5;quotes:none;font-style:italic}
.word small{display:block;margin-top:12px;font-size:12px;color:var(--dim);letter-spacing:.04em}

/* main button */
.cta{display:block;width:100%;margin-top:26px;text-align:center;padding:18px 20px;border-radius:16px;
  background:linear-gradient(135deg,#EACF98,var(--gold) 45%,#B99A5E);color:#1A2620;
  font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:bold;
  box-shadow:0 8px 28px rgba(216,188,132,.18)}
.cta span{display:block;font-weight:normal;font-style:italic;letter-spacing:0;text-transform:none;font-size:14px;margin-top:4px;opacity:.75}
.cta:active{transform:scale(.99)}

/* rituals */
.group+.group{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.group .cap{display:block;margin-bottom:6px}
.item{display:flex;gap:14px;width:100%;padding:9px 0;align-items:flex-start}
.tick{flex:0 0 20px;height:20px;border-radius:50%;border:1px solid var(--gold-dim);margin-top:3px;position:relative;transition:background .2s}
.item.done .tick{background:var(--gold);border-color:var(--gold)}
.item.done .tick:after{content:"";position:absolute;left:6px;top:3px;width:5px;height:10px;border:solid var(--deep);border-width:0 2px 2px 0;transform:rotate(45deg)}
.item.done .itxt{color:var(--dim)}
.itxt{flex:1}
.itxt em{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-style:normal;margin-top:2px}
.note{font-style:italic;color:var(--dim);font-size:15px}
.conflict{margin-top:8px;padding-left:14px;border-left:2px solid var(--rose);font-size:15px;color:var(--dim)}

/* rules */
.rules ul{list-style:none}
.rules li{padding:7px 0 7px 18px;position:relative}
.rules li:before{content:"";position:absolute;left:0;top:17px;width:6px;height:6px;border-radius:50%;background:var(--gold-dim)}
.rules .group .note{padding:4px 0}

/* konspekt */
.ktitle{font-weight:normal;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:center;margin:10px 0 24px}
.kcard{margin-bottom:14px;padding:0;overflow:hidden}
.khead{display:block;width:100%;padding:18px 20px}
.khead b{display:block;font-weight:normal;font-size:19px}
.khead i{display:block;color:var(--dim);font-size:15px;margin-top:2px}
.ksec{border-top:1px solid var(--line)}
.ksec>button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:14px 20px;font-size:16px}
.ksec>button:after{content:"+";color:var(--gold-dim);font-size:18px;line-height:1}
.ksec.open>button:after{content:"–"}
.kbody{display:none;padding:0 20px 18px;font-size:16px}
.kbody p+p{margin-top:10px}
.ksec.open .kbody{display:block}

.pcount{text-align:center;color:var(--dim);font-style:italic;font-size:15px;margin:-14px 0 18px}
.psearch{width:100%;font:inherit;font-size:16px;color:var(--cream);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;-webkit-appearance:none}
.psearch::placeholder{color:var(--dim);font-style:italic}
.psearch:focus{outline:none;border-color:var(--gold-dim)}
.pn{font-size:12px;color:var(--gold-dim);letter-spacing:.1em;margin-left:6px}
.psrc{font-style:italic;color:var(--dim);font-size:14px}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--deep2);overflow-y:auto;display:none;
  background:radial-gradient(ellipse 120% 60% at 50% -10%,#1C3129 0%,var(--deep2) 60%);}
.ov.show{display:block}
.ovtop{display:flex;justify-content:space-between;align-items:center}
.ovtop button{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding:6px 0 6px 12px}
.sit{display:block;width:100%;margin-top:14px;padding:18px 20px}
.sit b{display:block;font-weight:normal;font-size:19px}
.sit i{display:block;color:var(--dim);font-size:15px;margin-top:3px}
.sd h2{font-weight:normal;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);line-height:1.3;margin:28px 0 8px}
.sd .trig{font-style:italic;color:var(--dim);font-size:18px}
.sd .ans{margin-top:22px}
.sd ol{list-style:none;counter-reset:s;margin-top:12px}
.sd ol li{counter-increment:s;display:flex;gap:18px;padding:8px 0}
.sd ol li:before{content:counter(s);flex:0 0 14px;color:var(--gold-dim);font-size:13px;padding-top:4px}
.phrase{margin-top:24px;border:1px solid var(--gold-dim);border-radius:16px;padding:18px 20px}
.phrase .cap{display:block;margin-bottom:8px}
.phrase p{color:var(--gold);font-size:19px;line-height:1.5}
.src{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-style:italic;color:var(--dim);font-size:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;
  background:rgba(15,26,22,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:0 1 160px;text-align:center;padding:16px 0 14px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.tabs button.on{color:var(--gold)}
.hidden{display:none}
.fallback{margin-top:34px;text-align:center;font-size:12px;color:var(--dim);opacity:.8}
.stub{text-align:center;padding-top:30vh}
.stub p{color:var(--dim);font-style:italic;margin:10px 0 22px}
.stub button{border:1px solid var(--gold-dim);border-radius:12px;padding:12px 22px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

     "source": "Раскрытие женственности",
     "text": "Медитация «Золотая чаша Свадхистаны» - это не просто визуализация, это глубокий психосоматический процесс, который буквально перепрошивает нейронные связи между вашим мозгом и вашей маткой. Когда вы выполняете её правильно, температура в области малого таза физически повышается на полградуса, улучшается микроциркуляция, спадают вековые спазмы, и ваше тело начинает вибрировать на той самой частоте, которую мужчины безошибочно считывают как «чистый женский магнетизм».\n\nНиже я даю вам подробнейшую пошаговую инструкцию - ваш личный сакральный ритуал.\n\nПодготовка пространства и тела\n\nВремя и обстановка имеют колоссальное значение для женщины. Свадхистана не открывается в спешке и при ярком офисном свете.\n\nВремя: Лучше всего делать практику вечером перед сном или утром сразу после пробуждения, когда мозг находится в мягком альфа-состоянии (между сном и явью).\n\nАтмосфера: Приглушите свет. Зажгите восковую свечу. Если есть возможность, включите очень тихую медитативную музыку без слов (звуки воды, тибетские поющие чаши или тягучий эмбиент). Нанесите на запястья каплю масла жасмина, розы или иланг-иланга.\n\nОдежда: Снимите всё, что давит на талию и бедра - никаких тугих резинок, джинсов или белья с косточками. Идеально - свободное шелковое платье, свободная ночная сорочка или вообще без одежды под мягким пледом.\n\nПоза: Лягте на спину на удобную кровать или коврик. Под колени можно положить валик или подушку - когда колени слегка приподняты, поясница и низ живота расслабляются автоматически.\n\nШаг 1. Вход в тело и отключение «Головы-Контролера»\n\nПрежде чем идти в женский центр, мы должны забрать энергию из перегруженной мыслями головы.\n\nЗакройте глаза. Сделайте глубокий, медленный вдох через нос и плавный, долгий выдох через слегка приоткрытый рот с тихим звуком «Хааа». Повторите 3 раза.\n\nСознательно пройдитесь внутренним взором по телу и «уроните» все зажимы:\n\nРасслабьте точку между бровями и лоб.\n\nРазожмите зубы, пусть нижняя челюсть станет тяжелой, а язык мягко ляжет на дно рта.\n\nОпустите плечи, почувствуйте, как они растекаются по кровати.\n\nРасслабьте ягодицы и бедра. Почувствуйте приятную тяжесть во всем теле.\n\nШаг 2. Активация энергетического контура (Руки - Матка)\n\nМы соединяем тепло ваших ладоней (вашу отдающую целительную силу) с вашим сакральным центром.\n\nПоднимите руки и начните мягко, с любовью растирать ладони друг о друга, пока они не станут горячими.\n\nПоложите обе ладони на самый низ живота (на 3-4 сантиметра ниже пупка, прямо над лобковой костью):\n\nБольшие и указательные пальцы можно соединить, образовав форму треугольника (йони-мудру), вершиной направленного вниз.\n\nПочувствуйте, как физическое тепло от ваших горячих ладоней начинает медленно, слой за слоем проникать сквозь кожу вглубь вашего живота.\n\nПочувствуйте, как под ладонями появляется мягкая, живая пульсация - это просыпается ваш женский центр.\n\nШаг 3. Рождение Золотой Чаши (Визуализация и ощущения)\n\nТеперь мы включаем тонкое видение и материализуем образ источника вашей сексуальности.\n\nНаправьте всё свое внимание глубоко внутрь таза, в пространство матки.\n\nПредставьте, что внутри вашего низа живота находится роскошная, старинная чаша из чистого, полированного золота.\n\nРассмотрите её: её края гладкие, мягкие, она имеет идеальную округлую форму, впитывающую и хранящую жизнь.\n\nЭта чаша до самых краев наполнена волшебным нектаром Свадхистаны:\n\nОн теплого, янтарно-оранжевого, медового цвета.\n\nОн текучий, густой, сияющий изнутри живым золотистым светом.\n\nОт него исходит тонкий, дурманящий аромат цветов, ванили и спелых персиков.\n\nПочувствуйте, что этот нектар - это и есть ваша первозданная женская суть: сочная, сладкая, теплая, не знающая запретов и страхов.\n\nШаг 4. Дыхание Свадхистаны (Разлив тепла по телу)\n\nЭто ключевая часть практики, где вы запускаете циркуляцию сексуального магнетизма по всему телу.\n\nЦикл дыхания (выполняйте медленно, без пауз, 10–15 раз):\n\nВдох (на 4 счета): Вы делаете плавный, медленный вдох носом, представляя, что вы вдыхаете чистый золотой свет прямо через матку. С каждым вдохом нектар в чаше нагревается, начинает мягко бурлить, светиться еще ярче и источать приятное, обволакивающее тепло.\n\nМягкая микро-пауза (на 2 счета): Задержите дыхание на пару секунд, ощущая приятную наполненность и пульсацию внизу живота.\n\nВыдох (на 6 счетов): Вы делаете медленный, томный выдох через рот и представляете, как этот теплый, медовый нектар переливается через края Золотой Чаши и начинает медленными, густыми волнами растекаться по всему вашему телу:\n\nПервая волна омывает тазовое дно, растворяя все мышечные зажимы, холод и остатки страха. Мышцы таза становятся мягкими, словно тающее масло.\n\nВторая волна тепла течет вниз - по бедрам, коленям, голеням, согревая стопы и кончики пальцев ног.\n\nТретья волна поднимается вверх - согревает поясницу, крестец, позвоночник, наполняет грудь, расслабляет плечи, шею и омывает ваше лицо, делая губы мягкими и чувственными.\n\nС каждым выдохом вы чувствуете, как ваше тело становится невероятно тяжелым, напитанным, расслабленным, текучим и сочным, словно спелый фрукт на солнце.\n\nШаг 5. Растворение брони и ментальное якорение\n\nВ этом состоянии ваше подсознание максимально открыто для новых программ. Мы закладываем фундамент вашей новой женской реальности.\n\nПоложите руки чуть шире на бедра. Почувствуйте, как ваш живот мягко поднимается и опускается при дыхании - он абсолютно свободен, в нем нет ни грамма напряжения.\n\nПроговорите про себя медленно, смакуя каждое слово, три священные формулы:\n\n«Я отпускаю контроль. Мое тело в полной безопасности».\n\n«Я разрешаю себе наслаждаться жизнью, мужчинами и своей женской природой».\n\n«Мой женский центр наполнен теплом, нектаром и непреодолимым притяжением. Я - чистый источник наслаждения».\n\nШаг 6. Расширение золотого поля и выход из практики\n\nМы создаем вокруг вас то самое невидимое магнитное облако, которое будет считываться мужчинами в пространстве.\n\nПредставьте, как золотисто-янтарный свет из вашей чаши начинает выходить за пределы вашего физического тела, образуя вокруг вас теплое, сияющее, ароматное поле радиусом в один-два метра.\n\nПочувствуйте, что вы находитесь внутри этого кокона наслаждения. Всякий, кто попадает в поле этого света, мгновенно успокаивается, чувствует тепло и непреодолимое желание приблизиться к вам.\n\nСделайте глубокий, благодарный вдох, улыбнитесь кончиками губ. Медленно пошевелите пальцами ног и рук, сладко потянитесь всем телом, словно сытая, довольная кошка после долгого сна, и мягко откройте глаза."

  function todayHTML(){
    var d = today(), m = moon(d), M = D.meta||{}, h = '';
    h += '<div class="dateline"><span>'+d.getDate()+' '+MONTHS[d.getMonth()]+'</span><span>'+DAYS[d.getDay()]+'</span><span>'+m.name+'</span></div>';
    if (PHOTO && PHOTO.indexOf('data:')===0) h += '<div class="portrait"><img src="'+PHOTO+'" alt=""></div>';
    h += '<div class="who"><span class="cap">'+esc(M.path_label||'')+'</span><h1>'+esc(M.path||'')+'</h1>'+(M.path_note?'<p>'+esc(M.path_note)+'</p>':'')+'</div>';

    h += forecastHTML(d);

    var W = D.words||[];
    if (W.length){
      var w = W[Math.floor(d.getTime()/864e5) % W.length];
      h += '<div class="block"><div class="card word"><span class="cap">Слово дня</span><q style="margin-top:12px">'+esc(w.text)+'</q><small>'+esc(w.source)+'</small></div></div>';
    }

    if ((D.situations||[]).length)
      h += '<button class="cta" id="open-sit">Когда накрыло<span>выбери, что сейчас происходит</span></button>';

    h += transitsHTML(d);
    h += ritualsHTML(d, m);
    h += rulesHTML();
    return h;
  }

  function active(list,d){ return (list||[]).filter(function(x){ var f=parse(x.from),t=parse(x.to); return (!f||f<=d)&&(!t||d<=t); }); }
  function range(x){ return (x.from?fmt(parse(x.from)):'…')+' — '+(x.to?fmt(parse(x.to)):'дата уточняется')+(x.approximate?', ориентировочно':''); }
  function adviceHTML(a){ return (a&&a.length)?'<ul class="adv">'+a.map(function(z){return '<li>'+esc(z)+'</li>';}).join('')+'</ul>':''; }
  function bgHTML(list,d){
    var b = active(list,d); if(!b.length) return '';
    return '<div class="bg"><span class="cap">На фоне</span>'+b.map(function(x){return '<p><span>'+esc(x.name)+'</span>'+(x.to?' до '+fmt(parse(x.to)):'')+(x.meaning?'<i> — '+esc(x.meaning)+'</i>':'')+'</p>';}).join('')+'</div>';
  }

  function forecastHTML(d){
    var P = D.periods||{}, pl = P.planetary||[], h = '';
    if (!pl.length){
      return D.forecast_placeholder ? '<div class="block"><div class="card forecast-empty"><span class="cap">Прогноз</span>'+esc(D.forecast_placeholder)+'</div></div>' : '';
    }
    var i = current(pl, d), p = i>=0 ? pl[i] : null;
    var last = parse(pl[pl.length-1].to), ended = !p && last && d>last;
    if (p){
      var t = parse(p.to), left = t ? days(d,t)+1 : null;
      h += '<div class="block period"><span class="cap">Сейчас идёт</span><h2>'+esc(p.name)+'</h2>'+
        '<div class="dates">'+range(p)+'</div>'+
        (left!=null?'<div class="left">сменится через '+left+' '+plural(left,'день','дня','дней')+'</div>':'')+'</div>';
    } else if (ended){
      h += '<div class="block"><div class="card forecast-empty"><span class="cap">Прогноз</span>Расписанные периоды закончились. Чтобы здесь снова было «где ты сейчас», нужны новые даты от астролога.</div></div>';
    } else {
      h += '<div class="block period"><span class="cap">Прогноз</span><div class="dates">Следующий период начнётся '+fmt(parse(pl.filter(function(x){return parse(x.from)>d;})[0].from))+'</div></div>';
    }
    if (!ended){
      h += '<div class="ribbon" id="ribbon">';
      pl.forEach(function(q,k){
        var cls = k===i ? 'now' : (parse(q.to) && parse(q.to)<d ? 'past' : '');
        h += '<div class="rb '+cls+'"><div class="dot"></div><small>'+esc(q.short||q.name)+'</small></div>';
      });
      h += '</div>';
    }
    if (p && (p.meaning||p.caution||(p.advice||[]).length)){
      h += '<div class="block"><div class="card meaning"><span class="cap">Что это значит</span>'+paras(p.meaning)+
        (p.caution?'<div class="caution"><span class="cap">Осторожно</span>'+esc(p.caution)+'</div>':'')+
        ((p.advice||[]).length?'<div class="sub"><span class="cap">Что поможет</span>'+adviceHTML(p.advice)+'</div>':'')+
        bgHTML(P.background,d)+'</div></div>';
    } else if (!ended) h += '<div class="block"><div class="card meaning">'+bgHTML(P.background,d)+'</div></div>';
    var sg = P.sign||[], j = current(sg,d);
    if (j>=0){ var s=sg[j];
      h += '<div class="block"><div class="card meaning"><span class="cap">Обстоятельства</span><h3>'+esc(s.name)+'</h3><p class="note">'+range(s)+'</p>'+paras(s.meaning)+
        (s.caution?'<div class="caution"><span class="cap">Осторожно</span>'+esc(s.caution)+'</div>':'')+
        ((s.advice||[]).length?'<div class="sub"><span class="cap">Что поможет</span>'+adviceHTML(s.advice)+'</div>':'')+
        bgHTML(P.sign_background,d)+'</div></div>';
    }
    return h;
  }

  function transitsHTML(d){
    var tr = active((D.periods||{}).transits,d); if(!tr.length) return '';
    var h = '<div class="block"><span class="cap gold">Долгие процессы</span>';
    tr.forEach(function(x,k){
      var ph = active(x.phases,d);
      h += '<div class="card tr"><h3>'+esc(x.name)+'</h3><p class="note">'+range(x)+'</p>'+paras(x.meaning)+
        ph.map(function(z){return '<div class="phase"><span class="cap">Сейчас</span>'+esc(z.text)+'</div>';}).join('')+
        (x.caution?'<div class="caution"><span class="cap">Осторожно</span>'+esc(x.caution)+'</div>':'')+
        ((x.tasks||[]).length?'<div class="sub"><span class="cap">Задачи</span>'+adviceHTML(x.tasks)+'</div>':'');
      if (x.practice){
        var pr = x.practice;
        h += '<div class="prac"><button class="prhead" data-p="'+k+'">Практика «'+esc(pr.title)+'»</button><div class="prbody hidden" id="pr'+k+'">'+
          (pr.when?'<p class="note">'+esc(pr.when)+'</p>':'')+'<ol>'+(pr.steps||[]).map(function(z){return '<li><span>'+esc(z)+'</span></li>';}).join('')+'</ol></div></div>';
      }
      h += '</div>';
    });
    return h + '</div>';
  }

  function itemHTML(key, it){
    return '<button class="item'+(done[key]?' done':'')+'" data-k="'+key+'"><span class="tick"></span><span class="itxt">'+esc(it.text)+(it.tag?'<em>'+esc(it.tag)+'</em>':'')+'</span></button>';
  }

  function ritualsHTML(d, m){
    var R = D.rituals||{}, h = '<div class="block"><span class="cap gold">Опора на сегодня</span><div class="card">';
    var key = d.toISOString().slice(0,10);
    if ((R.daily||[]).length){
      h += '<div class="group"><span class="cap">Каждый день</span>';
      R.daily.forEach(function(it,k){ h += itemHTML(key+'d'+k,it); });
      h += '</div>';
    }
    var wd = (R.weekly||{})[String(d.getDay())];
    if (wd){
      h += '<div class="group"><span class="cap">'+esc(wd.title)+'</span>';
      wd.items.forEach(function(it,k){ h += itemHTML(key+'w'+k,it); });
      if (wd.conflict) h += '<div class="conflict">'+esc(wd.conflict)+'</div>';
      h += '</div>';
    }
    var L = R.lunar||{}, lun = m.full ? L.full : (m.isNew ? L['new'] : null);
    if (lun && lun.length){
      h += '<div class="group"><span class="cap">'+(m.full?'Полнолуние':'Новолуние')+'</span>';
      lun.forEach(function(it,k){ h += itemHTML(key+'l'+k,it); });
      h += '</div>';
    }
    var A = R.week_any||[];
    if (A.length){
      var wk = Math.floor((d.getTime()/864e5 + 3) / 7), it = A[wk % A.length];
      h += '<div class="group"><span class="cap">Практика недели</span><p class="note" style="font-size:14px">в любой день, когда будет настроение</p>'+itemHTML('wk'+wk,it)+'</div>';
    }
    if ((R.monthly||[]).length){
      h += '<div class="group"><span class="cap">Раз в месяц</span>';
      R.monthly.forEach(function(it,k){ h += itemHTML('m'+d.getMonth()+'_'+k,it); });
      h += '</div>';
    }
    return h + '</div></div>';
  }

  function rulesHTML(){
    var R = D.rules; if (!R) return '';
    var h = '<div class="block rules"><span class="cap gold">Мои опоры</span><div class="card">';
    h += '<div class="group"><span class="cap">Что я приняла</span>' + ((R.accepted||[]).length ?
      '<ul>'+R.accepted.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' :
      '<p class="note">Здесь появится то, что ты решишь держать как своё.</p>') + '</div>';
    if ((R.suggested||[]).length)
      h += '<div class="group"><span class="cap">Что советует астролог</span><ul>'+R.suggested.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    return h + '</div></div>';
  }

  function konspektHTML(){
    var h = '<h1 class="ktitle">Конспект</h1>';
    (D.konspekt||[]).forEach(function(c,ci){
      h += '<div class="card kcard"><button class="khead" data-c="'+ci+'"><b>'+esc(c.title)+'</b><i>'+esc(c.subtitle||'')+'</i></button><div class="kl hidden" id="kl'+ci+'">';
      (c.sections||[]).forEach(function(s){ h += '<div class="ksec"><button>'+esc(s.title)+'</button><div class="kbody">'+paras(s.body)+'</div></div>'; });
      h += '</div></div>';
    });
    return h;
  }


  function pItemHTML(it, showGroup){
    return '<div class="ksec"><button>'+esc(it.title)+'</button><div class="kbody"><p class="psrc">'+esc(it.source||'')+(showGroup?' · '+esc(showGroup):'')+'</p>'+paras(it.text)+'</div></div>';
  }
  function practicesHTML(){
    var G = D.practices||[], n = 0; G.forEach(function(g){ n += g.items.length; });
    var h = '<h1 class="ktitle">Практики</h1><p class="pcount">'+n+' '+plural(n,'практика','практики','практик')+' из консультаций и прогноза</p>'+
      '<input id="psearch" class="psearch" type="search" placeholder="Найти практику" autocomplete="off"><div id="plist">'+groupsHTML()+'</div>';
    return h;
  }
  function groupsHTML(){
    return (D.practices||[]).map(function(g,gi){
      return '<div class="card kcard"><button class="khead pg" data-g="'+gi+'"><b>'+esc(g.title)+' <span class="pn">'+g.items.length+'</span></b><i>'+esc(g.subtitle||'')+'</i></button><div class="kl hidden" id="pg'+gi+'">'+
        g.items.map(function(it){ return pItemHTML(it); }).join('')+'</div></div>';
    }).join('');
  }
  function bindPractices(){
    var box = document.getElementById('plist'); if(!box) return;
    function wire(){
      box.querySelectorAll('.pg').forEach(function(b){ b.onclick=function(){ document.getElementById('pg'+b.dataset.g).classList.toggle('hidden'); }; });
      box.querySelectorAll('.ksec>button').forEach(function(b){ b.onclick=function(){ b.parentNode.classList.toggle('open'); }; });
    }
    wire();
    var inp = document.getElementById('psearch');
    inp.oninput = function(){
      var q = inp.value.trim().toLowerCase();
      if (q.length < 2){ box.innerHTML = groupsHTML(); wire(); return; }
      var res = [];
      (D.practices||[]).forEach(function(g){ g.items.forEach(function(it){
        if ((it.title+' '+it.text).toLowerCase().indexOf(q) >= 0) res.push([it,g.title]);
      }); });
      box.innerHTML = res.length ? '<div class="card kcard">'+res.map(function(r){ return pItemHTML(r[0], r[1]); }).join('')+'</div>' :
        '<p class="note" style="text-align:center;margin-top:20px">Ничего не нашлось</p>';
      wire();
    };
  }

  function bind(){
    app.querySelectorAll('.item').forEach(function(b){ b.onclick=function(){ var k=b.dataset.k; done[k]=!done[k]; b.classList.toggle('done',!!done[k]); }; });
    var o = document.getElementById('open-sit'); if (o) o.onclick = openList;
    bindPractices();
    app.querySelectorAll('.khead:not(.pg)').forEach(function(b){ b.onclick=function(){ document.getElementById('kl'+b.dataset.c).classList.toggle('hidden'); }; });
    if (tab==='konspekt') app.querySelectorAll('.ksec>button').forEach(function(b){ b.onclick=function(){ b.parentNode.classList.toggle('open'); }; });
    app.querySelectorAll('.prhead').forEach(function(b){ b.onclick=function(){ document.getElementById('pr'+b.dataset.p).classList.toggle('hidden'); b.classList.toggle('open'); }; });
    var r = document.getElementById('ribbon');
    if (r){ var n = r.querySelector('.now'); if (n) r.scrollLeft = n.offsetLeft - r.clientWidth/2 + n.clientWidth/2; }
  }

  // ситуации
  var level = 0;
  function back(){ if (level===2) openList(); else closeOv(); }
  function setBack(){ try{ if(tg && tg.BackButton){ level ? tg.BackButton.show() : tg.BackButton.hide(); } }catch(e){} }
  try{ if (tg && tg.BackButton) tg.BackButton.onClick(back); }catch(e){}

  function openList(){
    level = 1; setBack();
    var h = '<div class="ovtop"><span class="cap gold">Что сейчас происходит</span><button id="ovx">Закрыть</button></div>';
    D.situations.forEach(function(s,i){ h += '<button class="card sit" data-i="'+i+'"><b>'+esc(s.title)+'</b><i>'+esc(s.trigger)+'</i></button>'; });
    ovin.innerHTML = h; ov.classList.add('show'); ov.scrollTop = 0; document.body.style.overflow='hidden';
    document.getElementById('ovx').onclick = closeOv;
    ovin.querySelectorAll('.sit').forEach(function(b){ b.onclick=function(){ openSit(+b.dataset.i); }; });
  }
  function openSit(i){
    level = 2; setBack();
    var s = D.situations[i];
    var h = '<div class="ovtop"><span class="cap gold">Ситуация</span><button id="ovb">Назад</button></div><div class="sd">'+
      '<h2>'+esc(s.title)+'</h2><div class="trig">'+esc(s.trigger)+'</div><div class="ans">'+paras(s.answer)+'</div>';
    if ((s.steps||[]).length) h += '<div class="block" style="margin-top:26px"><span class="cap">Что делать</span><ol>'+s.steps.map(function(x){return '<li><span>'+esc(x)+'</span></li>';}).join('')+'</ol></div>';
    if (s.phrase) h += '<div class="phrase"><span class="cap">Готовая фраза</span><p>'+esc(s.phrase)+'</p></div>';
    if (s.source) h += '<div class="src">Источник: '+esc(s.source)+'</div>';
    ovin.innerHTML = h + '</div>'; ov.scrollTop = 0;
    document.getElementById('ovb').onclick = openList;
  }
  function closeOv(){ level = 0; setBack(); ov.classList.remove('show'); document.body.style.overflow=''; }

  document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ tab=b.dataset.tab; window.scrollTo(0,0); render(); }; });

  load();
})();
</script>
</body>
</html>
